plugins { id 'com.android.application' }
android {
    namespace 'com.onenonlygit.speedbreakerone'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.onenonlygit.speedbreakerone'
        minSdk 33
        targetSdk 35
        versionCode 6
        versionName '0.1.5-android-visual-diagnostic'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', "-DSB_ANDROID_DIAGNOSTICS=${project.findProperty('sbDiagnostics') ?: 'OFF'}" } }
    }
    signingConfigs {
        personal {
            if (System.getenv('SB_KEYSTORE')) {
                storeFile file(System.getenv('SB_KEYSTORE'))
                storePassword System.getenv('SB_STORE_PASSWORD')
                keyAlias System.getenv('SB_KEY_ALIAS')
                keyPassword System.getenv('SB_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { debuggable (project.findProperty('sbDiagnostics') == 'ON' || project.findProperty('sbBringup') == 'ON'); if (System.getenv('SB_KEYSTORE')) signingConfig signingConfigs.personal; minifyEnabled false }
        debug { if (System.getenv('SB_KEYSTORE')) signingConfig signingConfigs.personal; debuggable true }
    }
    sourceSets.main.java.srcDirs += '../../tools/SDL/android-project/app/src/main/java'
    externalNativeBuild { cmake { path '../CMakeLists.txt'; version '3.22.1' } }
}
